{% extends "base.html" %}

{% block title %}
  Login | MeloMatch
{% endblock %}

{% block content %}
  <div class="flex h-full w-full grow flex-col py-20 sm:px-8 md:px-16 lg:px-40">
    <div class="flex flex-col w-full items-center justify-center py-5 flex-1 max-w-md mx-auto">
      <h2 class="text-foreground tracking-light text-[28px] font-bold leading-tight px-4 text-center pb-3 pt-5">To
        Continue listening, Log in</h2>
      <form method="post" class="w-full">
        {% csrf_token %}
        {% for field in form %}
          <div class="flex w-full flex-col flex-wrap items-center gap-4 px-4 py-3">
            <label class="flex flex-col w-full flex-1">
              <input
                id="{{ field.id_for_label }}"
                name="{{ field.name }}"
                placeholder="{{ field.label }}"
                class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-white focus:outline-0 focus:ring-0 border-none bg-[#2f204b] focus:border-none h-14 placeholder:text-[#a48dce] p-4 text-base font-normal leading-normal"
                value="{{ field.value|default_if_none:'' }}"
              />
            </label>
            {% if field.errors %}
              <div class="text-red-500 text-sm mt-1">
                <i class="fas fa-exclamation-circle"></i>
                {{ field.errors.0 }}
              </div>
            {% endif %}
          </div>
        {% endfor %}
        <div class="flex px-4 py-3">
          <button
            type="submit"
            class="flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-full h-12 px-5 flex-1 bg-primary text-white text-base font-bold leading-normal tracking-[0.015em]"
          >
            <span class="truncate">Log in</span>
          </button>
        </div>
      </form>
      <a href="{% url 'signup' %}"
         class="text-[#a48dce] text-sm font-normal leading-normal pb-3 pt-1 px-4 text-center underline">
        Don't have an account? Sign up
      </a>
    </div>
  </div>
{% endblock %}
